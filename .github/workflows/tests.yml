name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest build
      - name: Test with pytest
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Check installed package resources
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from pathlib import Path; import uf3; from uf3.util.user_config import read_config; p = Path(uf3.__file__).with_name('default_options.yaml'); assert read_config(p)['degree'] == 2"

  optional-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[phonon_spectra]' pytest -r docs/requirements.txt
      - name: Test optional integration
        run: python -m pytest tests/test_audit_regressions.py -q
      - name: Build documentation without warnings
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
